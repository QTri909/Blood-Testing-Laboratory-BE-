
services:
  postgres-payment-service:
    image: postgres:15.5
    container_name: postgres_payment_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: paymentdb
    ports:
      - "5435:5432"
    volumes:
      - patient_volume:/var/lib/postgresql/data
    networks:
      - payment-network

  redis-payment-service:-
  image: redis:7-alpine
  container_name: redis_payment_cache
  ports:
    - "6379:6379"
  volumes:
    - redis_payment_volume:/data
  networks:
    - payment-network
  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: stripe_cli
    command: listen --forward-to http://172.21.112.1:8084/api/payments/webhook
    environment:
      STRIPE_API_KEY: sk_test_51SMkxFDAubI9QHGxdhUqNxFl4l2GMGmzBkkloDIhXWmoOieSq673SmO8lu6kvtsfqB1i6isItbUNC5bzL1sI2N0s002yvVcO3H
    networks:
      - payment-network
volumes:
  patient_volume:
  redis_payment_volume:
networks:
  payment-network:
    driver: bridge