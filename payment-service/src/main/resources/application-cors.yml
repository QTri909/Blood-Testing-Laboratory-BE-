app:
  cors:
    allowed-origins:
      - http://localhost:5173  # React development server
      # Add more origins as needed for different environments
    # - https://your-production-domain.com
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age: 3600  # 1 hour