spring:
  data:
    redis:
      # Single-node dev default
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 3000ms
  cache:
    type: redis
    redis:
      # 15 minutes default TTL for PENDING
      time-to-live: 900000

