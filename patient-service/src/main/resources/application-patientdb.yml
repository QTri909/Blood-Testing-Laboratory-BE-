
spring:
  datasource:
    url: ${PATIENT_DB_URL:jdbc:postgresql://localhost:5432/patientdb}
    username: ${PATIENT_DB_USERNAME:postgres}
    password: ${PATIENT_DB_PASSWORD:12345}
    driver-class-name: "org.postgresql.Driver"
    hikari:
      pool-name: PatientHikariCP
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: "SELECT 1"

  jpa:
    hibernate:
      ddl-auto: update # change to 'update' or 'none' if you prefer different behavior
      naming:
        physical-strategy: "org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl"
    properties:
      hibernate:
        dialect: "org.hibernate.dialect.PostgreSQLDialect"
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration/patient
    baseline-on-migrate: true

  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: [health, info]
  health:
    db:
      enabled: true
