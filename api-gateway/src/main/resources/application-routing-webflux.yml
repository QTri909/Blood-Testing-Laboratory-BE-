spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: iam-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/iam/**
            - id: instrument-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/instruments/**
            - id: monitoring-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/monitoring/**
            - id: patient-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/patients/**
            - id: payment-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/payments/**
            - id: testorder-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/testorders/**
            - id: warehouse-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/warehouses/**