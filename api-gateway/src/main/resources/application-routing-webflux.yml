
app:
  name: api-gateway
  api-version: /api/v1

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: iam-service
              uri: http://localhost:8080
              predicates:
                - Path=${app.api-version}/iam/**
            - id: instrument-service
              uri: http://localhost:8081
              predicates:
                - Path=${app.api-version}/instruments/**
            - id: monitoring-service
              uri: http://localhost:8082
              predicates:
                - Path=${app.api-version}/monitoring/**
            - id: patient-service
              uri: http://localhost:8083
              predicates:
                - Path=${app.api-version}/patients/**
            - id: payment-service
              uri: http://localhost:8084
              predicates:
                - Path=${app.api-version}/payments/**
            - id: testorder-service
              uri: http://localhost:8085
              predicates:
                - Path=${app.api-version}/testorders/**
            - id: warehouse-service
              uri: http://localhost:8086
              predicates:
                - Path=${app.api-version}/warehouses/**