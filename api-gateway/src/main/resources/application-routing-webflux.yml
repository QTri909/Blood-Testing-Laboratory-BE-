
app:
  name: api-gateway
  api-version: /api/v1

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # for IAM service
            - id: iam-service
              uri: http://localhost:8080
              predicates:
                - Path=${app.api-version}/iam/**
              filters:
                - RewritePath=/iam/(?<segment>(\\d+|auth|roles|logs|users.*)), /${segment}
                - RewritePath=/api/v1/iam/(?<segment>(\\d+|auth|roles|logs|users.*)), /api/v1/${segment}


            # for instrument service
            - id: instrument-service
              uri: http://localhost:8081
              predicates:
                - Path=${app.api-version}/instruments/**
              filters:
                - RewritePath=/api/v1/patients/(?<segment>(\\d+|blood-testing|reagents|instruments.*)), /api/v1/${segment}


            # for monitoring service
            - id: monitoring-service
              uri: http://localhost:8083
              predicates:
                - Path=${app.api-version}/monitoring/**
              filters:
                - RewritePath=/api/v1/monitoring/(?<segment>.*), /api/v1/${segment}

            # for patient service
            - id: patient-service
              uri: http://localhost:8087
              predicates:
                - Path=${app.api-version}/patients/**
              filters:
                - RewritePath=/api/v1/patients/(?<segment>(\\d+|audit-entries|clinical-notes|medical-records|user-snapshots.*)), /api/v1/${segment}

            # VNPay endpoints (create, callback, etc.)
            - id: payment-vnpay
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/payments/vnpay/**
              filters:
                - name: RewritePath
                  args:
                    regexp: '/api/v1/payments/vnpay/(.*)'
                    replacement: '/api/v1/payments/vnpay/$1'

            # PayPal endpoints
            # PayPal fallback
            - id: payment-paypal
              uri: http://localhost:8084
              predicates:
                - Path=/paypal/**
              filters:
                - RewritePath=/paypal/(?<segment>.*)/?, /api/v1/paypal/${segment}

            # Generic payment-service routes
            - id: payment-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/payments/**
              filters:
                - name: RewritePath
                  args:
                    regexp: '/api/v1/payments/(.*)'
                    replacement: '/api/v1/payments/$1'


            # for test order service
            - id: testorder-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/v1/test-orders/**       # everything under test-orders
              filters:
                - RewritePath=/api/v1/test-orders/(?<segment>(\\d+|parameters|test-result|comments|reports|config.*)), /api/v1/${segment}

            # for warehouse service
            - id: warehouse-service
              uri: http://localhost:8086
              predicates:
                - Path=${app.api-version}/warehouses/**,
              filters:
                - RewritePath=/api/v1/warehouses/(?<segment>(\\d+|test-parameters|instruments|parameter|vendors|configurations|reagents|supply|usage|filter.*)), /api/v1/${segment}