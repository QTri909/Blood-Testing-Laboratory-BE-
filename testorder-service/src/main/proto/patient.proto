syntax = "proto3";

option java_multiple_files = true;
option java_package = "sum25.group03.testorderservice.grpc";
option java_outer_classname = "PatientProto";

service PatientService {
  rpc GetPatientById (GetPatientByIdRequest) returns (GetPatientByIdResponse);
  rpc autoCreateMedicalRecord (AutoCreateMedicalRecordRequest) returns (CreatedMedicalRecordResponse);
  rpc assignPatientIdToMedicalRecord (AssignPatientIdToMedicalRecordRequest) returns (EmptyMsg);
}

message EmptyMsg {}

message AssignPatientIdToMedicalRecordRequest {
  int64 medicalRecordId = 1;
  int64 patientId = 2;
}

message AutoCreateMedicalRecordRequest {
  int64 createdBy = 1;
  int64 patientId = 2;
}

message GetPatientByIdRequest {
  int64 externalUserId = 1;
}

message GetPatientByIdResponse {
  int64 id = 1;
  string fullName = 2;
  string gender = 3;
  string dateOfBirth = 4;
  string phoneNumber = 5;
  string email = 6;
}

message CreatedMedicalRecordResponse {
  int64 recordId = 1;
}
