spring:
  profiles:
    active: testorderdb,grpc,kafka,smtp
  kafka:
    listener:
      ack-mode: manual
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "sum25.group03.instrumentservice.event,sum25.group03.testorderservice,sum25.group03.warehouseservice"
      group-id: test-result-group
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

corehere:
  client-name: default
  api-key: yNWIxRbIiAEGo7MsgioKEQejCfUZ0vU0TgKgMHgA

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      tags:
        application: testorder-service
      export:
        enabled: true

