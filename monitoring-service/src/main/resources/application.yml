server:
  port: 8083

spring:
  application:
    name: monitoring-service

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  data:
    mongodb:
      uri: mongodb://root:root123@localhost:27017/monitoring_db?authSource=admin

  retry:
    enabled: true

logging:
  level:
    root: info

management:
  server:
    port: 4000
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

monitoring:
  kafka:
    topic: processed-test-results
    raw-topic: raw-test-results
